plugins {
    id 'java'
    id 'jacoco'
    id 'checkstyle'
    id 'pmd'
    id 'com.diffplug.spotless' version '7.0.2'
    id 'de.aaschmid.cpd' version '3.5'
    id 'org.gradle.test-retry' version '1.6.2'
    id 'com.autonomousapps.dependency-analysis' version '3.19.2'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'com.vaadin' version '25.3.0'
}

group = 'com.mockingbirdbank'
description = 'Mockingbird Bank - read-only account dashboard SPA'

// Build metadata - see AGENTS.md's "Build version" section. The Docker build stage has no .git
// (.dockerignore excludes it), so every value can be passed in as a -P property instead (the
// Dockerfile forwards its build args that way); otherwise git itself is asked. Anything still
// missing is reported as "unknown" rather than failing the build.
def optionalProperty = { String name ->
    def value = findProperty(name)?.toString()?.trim()
    return value ? value : null
}
def gitOutput = { List<String> args ->
    if (!file('.git').exists()) {
        return null
    }
    try {
        def process = (['git'] + args).execute(null, rootDir)
        def stderr = new StringBuilder()
        process.consumeProcessErrorStream(stderr)
        def stdout = process.text.trim()
        process.waitFor()
        return process.exitValue() == 0 ? stdout : null
    } catch (IOException ignored) {
        return null
    }
}
def gitCommit = optionalProperty('gitCommit') ?: gitOutput(['rev-parse', 'HEAD']) ?: 'unknown'
def gitCommitShort = gitCommit == 'unknown' ? 'unknown' : gitCommit.take(7)
def gitBranch = optionalProperty('gitBranch') ?: gitOutput(['rev-parse', '--abbrev-ref', 'HEAD'])
if (gitBranch == 'HEAD') {
    gitBranch = 'detached'
}
gitBranch = gitBranch ?: 'unknown'
// Not "?:" for the porcelain output - a clean tree prints nothing, which Groovy treats as falsy.
def gitStatus = gitOutput(['status', '--porcelain'])
def gitDirty = optionalProperty('gitDirty')
        ?: (gitStatus == null ? 'unknown' : (gitStatus.isEmpty() ? 'false' : 'true'))
def gitCommitTime = optionalProperty('gitCommitTime') ?: gitOutput(['show', '-s', '--format=%ct', 'HEAD'])

version = optionalProperty('appVersion')
        ?: "${baseVersion}-${gitCommitShort}${gitDirty == 'true' ? '-dirty' : ''}".toString()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.vaadin.com/vaadin-addons' }
}

dependencyManagement {
    imports {
        mavenBom "com.vaadin:vaadin-bom:25.3.0"
        // Kept in sync with the testcontainers.version Spring Boot 4.1.1
        // itself manages; io.spring.dependency-management doesn't resolve
        // that nested BOM import automatically in this setup.
        mavenBom "org.testcontainers:testcontainers-bom:2.0.5"
    }
}

dependencies {
    implementation 'com.vaadin:vaadin-spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Spring Boot 4 split Flyway's autoconfiguration out of the core
    // autoconfigure jar into this dedicated starter - flyway-core alone
    // no longer triggers it. Postgres dialect support is still a separate
    // Flyway artifact (unbundled since Flyway 10) and must be added too.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    // Postgres dialect support is a runtime SPI plugin Flyway auto-discovers -
    // nothing in our source compiles against it directly, so runtimeOnly is
    // the correct (and minimal) scope. Confirmed via `./gradlew buildHealth`.
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // Referenced directly (SecurityConfig, AccountService/TransactionService's
    // @Transactional, ScrubbingMessageConverter, and slf4j Logger usage across
    // the codebase) rather than only through whichever starter happens to
    // pull them in transitively today - `./gradlew buildHealth` flags exactly
    // this class of gap. Versions stay managed by Spring Boot's BOM.
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-tx'
    implementation 'ch.qos.logback:logback-classic'
    implementation 'org.slf4j:slf4j-api'
    // AnalyticsEventService compiles directly against Micrometer's Counter/
    // MeterRegistry, not just whatever pulls it in transitively today
    // (currently spring-boot-starter-actuator) - same rationale as the four
    // dependencies just above.
    implementation 'io.micrometer:micrometer-core'
    // Circuit-breaking around AccountService/TransactionService's repository
    // calls - see ResilienceConfig. Pure Java, no Spring Boot integration
    // module needed (resilience4j-spring-boot3 targets Spring Boot 3's
    // actuator/autoconfigure APIs, not guaranteed compatible with Spring
    // Boot 4 yet), so this app registers/wires it explicitly instead.
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.4.0'
    implementation 'io.github.resilience4j:resilience4j-micrometer:2.4.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // `./gradlew buildHealth` flagged this: test sources construct Lombok-annotated model
    // classes (Account, Transaction, ...) directly, so javac needs Lombok's processor on the
    // test annotation-processing classpath too, not just main's - it was only getting there
    // transitively before.
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Distributed tracing: Spring Boot 4's dedicated OpenTelemetry+OTLP starter (tracing support
    // moved out of spring-boot-starter-actuator and into its own module in Boot 4). Pulls in the
    // Micrometer-to-OpenTelemetry bridge and the OTLP exporter; auto-instruments incoming HTTP
    // requests as spans (see management.tracing.*/management.opentelemetry.* below) purely from
    // being on the classpath - no application code imports these packages directly.
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'

    runtimeOnly 'org.postgresql:postgresql'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'com.vaadin:vaadin-dev'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    // ProgramMigrationTest drives Flyway directly (migrate to V1, add data, then migrate on)
    // instead of through Spring Boot's auto-configuration. Version from Spring Boot's BOM.
    testImplementation 'org.flywaydb:flyway-core'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.vaadin:vaadin-testbench-junit5'
}

vaadin {
    // Flip to true (or set via -Pvaadin.productionMode) when building a deployable jar.
    productionMode = false
}

// META-INF/build-info.properties -> Spring Boot's BuildProperties bean (/actuator/info's "build"
// section, BuildVersion). Build time is only recorded when passed in (the Dockerfile does): an
// always-changing timestamp would make the resources, and so every test task, out of date on every
// single run.
springBoot {
    buildInfo {
        def buildTime = optionalProperty('buildTime')
        if (buildTime) {
            properties {
                time = buildTime
            }
        } else {
            excludes = ['time']
        }
    }
}

// git.properties -> Spring Boot's GitProperties bean (/actuator/info's "git" section). Written by
// hand instead of via a git-properties plugin because those need a .git directory, which the Docker
// build doesn't have - values come from the gitCommit/gitBranch/... resolution at the top of this
// file instead.
def generateGitProperties = tasks.register('generateGitProperties', WriteProperties) {
    group = 'build'
    description = 'Writes git.properties (commit, branch, dirty flag) for /actuator/info.'
    destinationFile = layout.buildDirectory.file('generated/git/git.properties')
    property('git.commit.id', gitCommit)
    property('git.commit.id.abbrev', gitCommitShort)
    property('git.branch', gitBranch)
    property('git.dirty', gitDirty)
    if (gitCommitTime) {
        property('git.commit.time', gitCommitTime)
    }
}
tasks.named('processResources') {
    from(generateGitProperties)
}

// Finds genuinely unused dependencies and dependencies used but only pulled
// in transitively. Framework "starter"/facade artifacts (Spring Boot,
// Vaadin, ...) are intentionally never referenced by class name in our code
// - that's the point of a starter - so without the bundles below the plugin
// would flag every one of them as "unused" and every framework-internal
// class we do reference (e.g. `SpringApplication`) as "used transitively,
// declare it directly", which would mean fighting the framework's own BOM
// instead of tracking real dependency hygiene. Each bundle below groups a
// starter with the internals it exists to pull in, so the bundle as a whole
// is correctly seen as "used" via whichever member we actually reference.
dependencyAnalysis {
    issues {
        all {
            onUnusedDependencies { severity('fail') }
            onIncorrectConfiguration { severity('fail') }
        }
    }
    structure {
        bundle('spring-boot') {
            includeGroup('org.springframework.boot')
        }
        bundle('spring-framework') {
            includeGroup('org.springframework')
        }
        bundle('spring-security') {
            includeGroup('org.springframework.security')
            includeDependency('org.springframework.boot:spring-boot-starter-security')
        }
        bundle('spring-data') {
            includeGroup('org.springframework.data')
            includeDependency('org.springframework.boot:spring-boot-starter-data-jpa')
        }
        bundle('hibernate') {
            includeGroup('org.hibernate.orm')
            includeGroup('org.hibernate.validator')
            includeDependency('jakarta.persistence:jakarta.persistence-api')
            includeDependency('jakarta.validation:jakarta.validation-api')
            includeDependency('org.springframework.boot:spring-boot-starter-data-jpa')
        }
        bundle('web') {
            includeGroup('org.apache.tomcat.embed')
            includeDependency('org.springframework:spring-web')
            includeDependency('io.projectreactor:reactor-core')
            includeDependency('org.springframework.boot:spring-boot-starter-web')
        }
        bundle('logging') {
            includeGroup('ch.qos.logback')
            includeGroup('org.apache.logging.log4j')
            includeDependency('org.slf4j:slf4j-api')
        }
        bundle('vaadin') {
            includeGroup('com.vaadin')
        }
        bundle('junit') {
            includeGroup('org.junit.jupiter')
            includeGroup('org.junit.platform')
            includeDependency('org.opentest4j:opentest4j')
            includeDependency('org.springframework.boot:spring-boot-starter-test')
        }
        bundle('test-support') {
            // Pulled in by spring-boot-starter-test; never referenced by
            // class name in our tests but genuinely exercised at runtime.
            includeDependency('org.assertj:assertj-core')
            includeDependency('org.hamcrest:hamcrest')
            includeDependency('org.mockito:mockito-core')
            includeDependency('org.mockito:mockito-junit-jupiter')
            includeDependency('org.springframework.boot:spring-boot-test')
            includeDependency('org.springframework:spring-beans')
            includeDependency('org.springframework:spring-test')
            includeDependency('org.springframework.boot:spring-boot-starter-test')
        }
        bundle('opentelemetry') {
            // Pulled in transitively by testcontainers for its own tracing;
            // never referenced by our test code.
            includeGroup('io.opentelemetry')
            includeDependency('org.testcontainers:testcontainers-junit-jupiter')
        }
        bundle('selenium') {
            // Pulled in by vaadin-testbench-junit5 to drive a real browser;
            // TestBench's API is what we call, not Selenium directly.
            includeGroup('org.seleniumhq.selenium')
            includeDependency('com.vaadin:vaadin-testbench-junit5')
        }
    }
}

checkstyle {
    toolVersion = '10.20.2'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    // Errors (naming, imports, complexity, file size, etc.) still fail the build;
    // TODO/FIXME markers are reported as warnings so debt is visible without blocking work.
    maxWarnings = Integer.MAX_VALUE
    ignoreFailures = false
}

// Checkstyle only targets first-party Java sources; generated Vaadin frontend
// assets aren't Java and Lombok-generated accessors are handled at compile time.
tasks.named('checkstyleMain') {
    source = fileTree('src/main/java')
}
tasks.named('checkstyleTest') {
    source = fileTree('src/test/java')
}

// Keep the linter in the normal build/verification flow so agents see
// violations as part of `./gradlew check`/`./gradlew build`.
tasks.named('check') {
    dependsOn tasks.named('checkstyleMain'), tasks.named('checkstyleTest')
}

pmd {
    toolVersion = '7.7.0'
    ruleSetFiles = files("${rootDir}/config/pmd/dead-code.xml")
    ruleSets = []
    consoleOutput = true
    ignoreFailures = false
}

// PMD only targets first-party Java; Vaadin's generated frontend isn't Java.
tasks.named('pmdMain') {
    source = fileTree('src/main/java')
}
tasks.named('pmdTest') {
    source = fileTree('src/test/java')
}
tasks.named('check') {
    dependsOn tasks.named('pmdMain'), tasks.named('pmdTest')
}

cpd {
    toolVersion = '7.7.0'
    language = 'java'
}
cpdCheck {
    source = fileTree('src/main/java') + fileTree('src/test/java')
    // Below this, short getter/setter/builder boilerplate reads as a "duplicate"
    // even though it isn't meaningful repetition worth extracting.
    minimumTokenCount = 75
    ignoreFailures = false
}
tasks.named('check') {
    dependsOn tasks.named('cpdCheck')
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
        googleJavaFormat('1.25.2').aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// Fail the build on unformatted code, same as any other verification check.
tasks.named('check') {
    dependsOn tasks.named('spotlessCheck')
}

jacoco {
    toolVersion = '0.8.12'
}

jacocoTestReport {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

// Neither jacocoTestReport nor jacocoTestCoverageVerification depend on each
// other, so without this, `check`/`build` only ran the (non-HTML) coverage
// verification - the actual browsable HTML report at
// build/reports/jacoco/test/html/index.html that AGENTS.md documents was
// never generated by a plain `./gradlew build`, only by asking for it
// explicitly. CI's "Upload JaCoCo coverage report" artifact step was
// silently uploading nothing as a result - caught by actually checking the
// workflow run's annotations, not just its green checkmark.
tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport')
}

// The Vaadin UI (com.mockingbirdbank.ui.*) is declarative view/layout code with
// no branching logic - it isn't unit-testable without a full browser fixture,
// and forcing a blanket percentage across the whole codebase would either be
// too low to mean anything or push people toward hollow tests just to hit a
// number. Instead this gates the business logic packages, which already sit
// at 94-100% line coverage today, at a real, meaningful threshold, plus a low
// project-wide floor so overall coverage can't silently regress.
jacocoTestCoverageVerification {
    dependsOn tasks.named('test')
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.30
            }
        }
        rule {
            element = 'CLASS'
            includes = [
                'com.mockingbirdbank.model.*',
                'com.mockingbirdbank.service.*',
                'com.mockingbirdbank.security.*',
                'com.mockingbirdbank.config.*',
                'com.mockingbirdbank.analytics.*',
                'com.mockingbirdbank.resilience.*',
                'com.mockingbirdbank.observability.*',
            ]
            limit {
                counter = 'LINE'
                minimum = 0.90
            }
        }
    }
}
tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

// Generates the Javadoc site into build/docs/javadoc on every build and fails
// it if any @link/@see/HTML reference is actually broken (missing-tag warnings
// are allowed - not every method needs prose - but a dangling reference means
// the docs have drifted from the code and should be caught here, not shipped).
javadoc {
    title = "Mockingbird Bank ${version} API"
    source = fileTree('src/main/java')
    options {
        encoding = 'UTF-8'
        addStringOption('Xdoclint:all,-missing', '-quiet')
        links('https://docs.oracle.com/en/java/javase/21/docs/api/')
    }
    failOnError = true
}
tasks.named('check') {
    dependsOn tasks.named('javadoc')
}

// Points Git at the checked-in .githooks/pre-commit script so Spotless and
// Checkstyle run locally before a commit is even created, not just in CI.
// Runs as part of every build so a fresh clone is wired up with no manual
// `git config` step required.
tasks.register('installGitHooks') {
    group = 'verification'
    description = 'Configures Git to use the checked-in hooks in .githooks/'
    onlyIf { file('.githooks').isDirectory() && file('.git').isDirectory() }
    doLast {
        def process = ['git', 'config', 'core.hooksPath', '.githooks'].execute(null, projectDir)
        process.waitFor()
        if (process.exitValue() != 0) {
            throw new GradleException("Failed to set core.hooksPath: ${process.err.text}")
        }
    }
}
tasks.named('build') {
    dependsOn tasks.named('installGitHooks')
}

// Fails the build if AGENTS.md references a Gradle task or file/directory
// path that no longer exists, so the doc can't silently rot as the project
// evolves. See scripts/validate-agents-md.sh.
tasks.register('validateAgentsMd') {
    group = 'verification'
    description = "Checks that Gradle tasks and paths referenced in AGENTS.md still exist."
    doLast {
        def process =
                ['bash', "${rootDir}/scripts/validate-agents-md.sh"].execute(null, rootDir)
        process.consumeProcessOutput(System.out, System.err)
        process.waitFor()
        if (process.exitValue() != 0) {
            throw new GradleException(
                    'AGENTS.md references a missing Gradle task or file path - see output above.')
        }
    }
}
tasks.named('check') {
    dependsOn tasks.named('validateAgentsMd')
}

// Catches genuinely unused dependencies and dependencies used at the wrong
// scope (e.g. compile-time when only needed at runtime) - see the
// dependencyAnalysis {} block above for how framework starters are handled
// so this doesn't just turn into noise about Spring/Vaadin internals.
tasks.named('check') {
    dependsOn tasks.named('buildHealth')
}

test {
    useJUnitPlatform()
    // Per-test PASSED/FAILED/SKIPPED lines (with duration) in the console output,
    // instead of only a final pass/fail summary.
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }

    // Automatically re-runs a failed test up to 2 more times. A test that fails
    // once but passes on retry is flaky, not broken - failOnPassedAfterRetry
    // = false means it doesn't block the build, but every attempt still shows
    // up in the flaky-test report below so the instability itself isn't lost.
    retry {
        maxRetries = 2
        maxFailures = 10
        failOnPassedAfterRetry = false
    }
}

// Tracks per-test-method duration and writes a "slowest tests" report on every
// run, so the suite's performance is visible over time instead of only whether
// it passed. Warns (doesn't fail the build) on anything unexpectedly slow -
// the Testcontainers-backed integration tests legitimately take a few seconds
// for container startup, so a hard failure here would be noise, not signal.
def testStartNanos = new java.util.concurrent.ConcurrentHashMap()
def testDurationsMs = new java.util.concurrent.ConcurrentLinkedQueue()
def slowTestThresholdMs = 10_000L

// Records every attempt's outcome per test (test-retry re-runs a failed test,
// firing these listeners again for the same test name) so a test whose
// attempts disagree - e.g. FAILURE then SUCCESS - can be flagged as flaky
// instead of the retry silently hiding the instability.
def testAttemptOutcomes = new java.util.concurrent.ConcurrentHashMap()

tasks.named('test') {
    beforeTest { descriptor -> testStartNanos[descriptor] = System.nanoTime() }

    afterTest { descriptor, result ->
        def start = testStartNanos.remove(descriptor)
        if (start == null) {
            return
        }
        long durationMs = (System.nanoTime() - start) / 1_000_000L
        testDurationsMs << [name: "${descriptor.className}.${descriptor.name}", ms: durationMs]
        if (durationMs > slowTestThresholdMs) {
            logger.warn(
                    "SLOW TEST (${durationMs}ms, over the ${slowTestThresholdMs}ms tracking "
                            + "threshold): ${descriptor.className}.${descriptor.name}")
        }

        def key = "${descriptor.className}.${descriptor.name}"
        testAttemptOutcomes.putIfAbsent(key, new java.util.concurrent.ConcurrentLinkedQueue())
        def bucket = testAttemptOutcomes.get(key)
        bucket << result.resultType.toString()
    }

    doLast {
        def sorted = testDurationsMs.toList().sort { -it.ms }
        def reportFile = layout.buildDirectory.file("reports/tests/test/timings.txt").get().asFile
        reportFile.parentFile.mkdirs()
        def header = "Slowest tests (of ${sorted.size()} total), sorted descending by duration:\n\n"
        def lines = sorted.collect { "${it.ms}ms\t${it.name}" }.join("\n")
        reportFile.text = header + lines + "\n"
        logger.lifecycle("Test timing report written to ${reportFile}")
        if (!sorted.isEmpty()) {
            logger.lifecycle("Slowest test: ${sorted[0].ms}ms - ${sorted[0].name}")
        }

        def flaky = testAttemptOutcomes.findAll { name, outcomes ->
            outcomes.size() > 1 && outcomes.toSet().size() > 1
        }
        def flakyReportFile = layout.buildDirectory.file("reports/tests/test/flaky.txt").get().asFile
        if (flaky.isEmpty()) {
            flakyReportFile.text =
                    "No flaky tests detected in this run (no test's attempts disagreed).\n"
        } else {
            def body = flaky.collect { name, outcomes -> "${name}: attempts=${outcomes}" }.join("\n")
            flakyReportFile.text = "Flaky tests detected this run:\n\n${body}\n"
            logger.warn("FLAKY TEST(S) DETECTED - see ${flakyReportFile}")
        }
    }
}

// Required by Harness CI Test Intelligence (TI) so it can inject its call-graph
// agent into the forked test JVM and safely filter to a subset of tests without
// failing when a given subproject has none of the selected tests.
// https://developer.harness.io/continuous-integration/troubleshooting-and-resources/ci-articles-and-faqs/articles/gradle-daemon#gradle-version-not-compatible-with-test-intelligence
tasks.withType(Test) {
    if (System.getProperty("HARNESS_JAVA_AGENT")) {
        jvmArgs += [System.getProperty("HARNESS_JAVA_AGENT")]
    }
}

gradle.projectsEvaluated {
    tasks.withType(Test) {
        filter {
            setFailOnNoMatchingTests(false)
        }
    }
}

// Tracks per-task and total build duration on every invocation, the same
// way the test-timing report above tracks per-test duration: written to
// disk every run so build performance is visible over time, not just
// whatever Gradle happens to print to the console for this one build. CI
// uploads build/reports/build-performance/ as an artifact (see
// .github/workflows/ci.yml) so a slow trend is visible across runs without
// needing a separate build-analytics platform.
def taskDurationsMs = new java.util.concurrent.ConcurrentLinkedQueue()
def taskStartNanos = new java.util.concurrent.ConcurrentHashMap()
def buildStartNanos = System.nanoTime()
def slowBuildThresholdMs = 5 * 60_000L

tasks.configureEach { task ->
    task.doFirst { taskStartNanos[task.path] = System.nanoTime() }
    task.doLast {
        def start = taskStartNanos.remove(task.path)
        if (start != null) {
            long ms = (System.nanoTime() - start) / 1_000_000L
            taskDurationsMs << [name: task.path, ms: ms]
        }
    }
}

gradle.buildFinished {
    long totalMs = (System.nanoTime() - buildStartNanos) / 1_000_000L
    def sorted = taskDurationsMs.toList().sort { -it.ms }
    def reportFile = layout.buildDirectory.file("reports/build-performance/summary.txt").get().asFile
    reportFile.parentFile.mkdirs()
    def header = "Total build time: ${totalMs}ms\n\n" +
            "Slowest tasks (of ${sorted.size()} total), sorted descending by duration. Gradle " +
            "can run independent tasks concurrently, so individual durations may overlap and " +
            "sum to more than the total build time above:\n\n"
    def lines = sorted.take(30).collect { "${it.ms}ms\t${it.name}" }.join("\n")
    reportFile.text = header + lines + "\n"
    logger.lifecycle("Build performance report written to ${reportFile} (total: ${totalMs}ms)")
    if (totalMs > slowBuildThresholdMs) {
        logger.warn(
                "SLOW BUILD (${totalMs}ms, over the ${slowBuildThresholdMs}ms tracking "
                        + "threshold) - see ${reportFile} for the slowest tasks.")
    }
}

// One aggregated, tracked-over-time snapshot of the numbers Checkstyle/PMD/CPD/JaCoCo already
// computed above - so "is code quality trending up or down" is answered by one small text file
// instead of opening five separate HTML reports and comparing them by eye across builds. Counts
// via simple regex over each tool's XML report rather than a full XML parser: these are flat,
// generated-not-handwritten files, and JaCoCo's XML in particular references an external DTD
// that a validating/entity-resolving parser would try to fetch over the network on every build.
gradle.buildFinished {
    def reportFile = layout.buildDirectory.file("reports/code-quality/summary.txt").get().asFile
    reportFile.parentFile.mkdirs()

    // These XML reports persist on disk across invocations, so a file existing doesn't mean it's
    // current - it could be left over from a previous `./gradlew pmdMain` while this build only
    // ran, say, `test`. taskDurationsMs (populated above by the build-performance tracker, which
    // every task feeds via doLast) tells us which tasks actually executed *this* build, so a
    // stale report from a different invocation is correctly reported as "not run this build"
    // rather than silently presented as fresh.
    def ranThisBuild = taskDurationsMs.collect { it.name }.toSet()

    def countOpeningTags = { String taskPath, String path, String tag ->
        if (!ranThisBuild.contains(taskPath)) {
            return null
        }
        def f = file(path)
        if (!f.exists()) {
            return null
        }
        def matches = (f.text =~ /<${tag}[\s\/>]/)
        return matches.count
    }

    def checkstyleMain =
            countOpeningTags(':checkstyleMain', 'build/reports/checkstyle/main.xml', 'error')
    def checkstyleTest =
            countOpeningTags(':checkstyleTest', 'build/reports/checkstyle/test.xml', 'error')
    def pmdMain = countOpeningTags(':pmdMain', 'build/reports/pmd/main.xml', 'violation')
    def pmdTest = countOpeningTags(':pmdTest', 'build/reports/pmd/test.xml', 'violation')
    def cpdDuplicates =
            countOpeningTags(':cpdCheck', 'build/reports/cpd/cpdCheck.xml', 'duplication')

    // Not "?:" - Groovy's Elvis operator treats 0 as falsy, which would mislabel a genuinely
    // clean "0 violations" result as "not run this build".
    def describe = { count -> count == null ? 'not run this build' : count.toString() }

    def lines = []
    lines << "Code quality summary - ${new Date().format("yyyy-MM-dd'T'HH:mm:ssXXX")}"
    lines << ''
    lines << "Checkstyle violations (main):  ${describe(checkstyleMain)}"
    lines << "Checkstyle violations (test):  ${describe(checkstyleTest)}"
    lines << "PMD violations (main):         ${describe(pmdMain)}"
    lines << "PMD violations (test):         ${describe(pmdTest)}"
    lines << "CPD duplicate blocks:          ${describe(cpdDuplicates)}"

    def jacocoFile = file('build/reports/jacoco/test/jacocoTestReport.xml')
    if (ranThisBuild.contains(':jacocoTestReport') && jacocoFile.exists()) {
        // The report-wide LINE counter is JaCoCo's last <counter type="LINE".../> in the file -
        // every package/class/method one comes first, then this one final total.
        def lineCounters =
                (jacocoFile.text =~ /<counter type="LINE" missed="(\d+)" covered="(\d+)"\/>/)
                        .findAll()
        if (!lineCounters.isEmpty()) {
            def last = lineCounters.last()
            int missed = last[1].toInteger()
            int covered = last[2].toInteger()
            int total = missed + covered
            double pct = total == 0 ? 0.0 : (covered * 100.0 / total)
            lines << "Line coverage (project-wide): ${String.format('%.1f', pct)}% " +
                    "(${covered}/${total} lines)"
        }
    } else {
        lines << 'Line coverage (project-wide): not run this build'
    }

    reportFile.text = lines.join('\n') + '\n'
    logger.lifecycle("Code quality summary written to ${reportFile}")
}
