name: Publish image

# Builds the production-mode Docker image and pushes it to GitHub Container
# Registry on every push to master, so there's always a deployable,
# traceable image for the latest commit without a human running
# createDockerHubImage.zsh by hand (see AGENTS.md's Docker image section for
# that separate, manual Docker Hub path). Uses the built-in GITHUB_TOKEN -
# no extra registry credentials to manage.
on:
  push:
    branches: [master]

concurrency:
  group: publish-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      # The one tag format the smoke-test job below can rely on regardless of what else
      # docker/metadata-action's tags list contains - full-length so it's unambiguous.
      sha_tag: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Version/commit the app reports at /actuator/info - see scripts/build-metadata.sh.
      - name: Collect build metadata
        id: buildmeta
        run: ./scripts/build-metadata.sh >> "$GITHUB_OUTPUT"

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
          # metadata-action would otherwise label the image version "latest".
          labels: |
            org.opencontainers.image.version=${{ steps.buildmeta.outputs.APP_VERSION }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.buildmeta.outputs.APP_VERSION }}
            GIT_COMMIT=${{ steps.buildmeta.outputs.GIT_COMMIT }}
            GIT_BRANCH=${{ steps.buildmeta.outputs.GIT_BRANCH }}
            GIT_DIRTY=${{ steps.buildmeta.outputs.GIT_DIRTY }}
            GIT_COMMIT_TIME=${{ steps.buildmeta.outputs.GIT_COMMIT_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Records a real GitHub Deployment (visible under the repo's Environments/Deployments UI, and
  # via the Deployments API) for every image this workflow publishes, then actually boots that
  # exact image against a throwaway Postgres and waits for /actuator/health to report healthy -
  # not just "the build succeeded", but "the artifact that got pushed actually starts and can
  # reach its database". The deployment is marked success/failure accordingly, so a bad image
  # is visible as a failed deployment even though publish itself already succeeded.
  deployment-smoke-test:
    name: Post-publish deployment smoke test
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      packages: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mydatabase
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Create GitHub deployment
        id: create-deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # required_contexts must be sent as an explicit empty array (not omitted) - the
          # Deployments API otherwise defaults it to this ref's current commit-status contexts
          # and returns 409 Conflict whenever any of them (CI, CodeQL, DAST, Secret scan, ... -
          # all running in parallel with this workflow, not a prerequisite for it) is still
          # pending or has failed for an unrelated reason. That's a raw JSON body, not
          # per-field -f/-F, hence --input here instead.
          payload=$(jq -n \
            --arg ref "${{ github.sha }}" \
            --arg description "Smoke test for ${{ env.IMAGE_NAME }}:${{ needs.publish.outputs.sha_tag }}" \
            '{ref: $ref, environment: "production", auto_merge: false, required_contexts: [], description: $description}')
          deployment_id=$(echo "$payload" | gh api "repos/${{ github.repository }}/deployments" --input - --jq .id)
          echo "id=$deployment_id" >> "$GITHUB_OUTPUT"
          gh api "repos/${{ github.repository }}/deployments/$deployment_id/statuses" \
            -f state=in_progress \
            -f description="Booting the published image and waiting on /actuator/health" \
            >/dev/null

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the image that was just published
        run: docker pull "${{ env.IMAGE_NAME }}:${{ needs.publish.outputs.sha_tag }}"

      # --network host: the Postgres service container above publishes to the runner's own
      # localhost (GitHub Actions' standard pattern for job-level services on ubuntu-latest,
      # which run directly on the VM rather than in a job container), so the app needs the same
      # network namespace to reach it at localhost:5432 without extra Docker networking setup.
      - name: Boot the image and wait for a healthy /actuator/health
        id: smoke_test
        run: |
          set -euo pipefail
          docker run -d --name smoke-test --network host \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/mydatabase \
            -e SPRING_DATASOURCE_USERNAME=admin \
            -e SPRING_DATASOURCE_PASSWORD=secret \
            "${{ env.IMAGE_NAME }}:${{ needs.publish.outputs.sha_tag }}"

          healthy=false
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [ "$healthy" != "true" ]; then
            echo "Published image never reported a healthy /actuator/health:" >&2
            docker logs smoke-test >&2
            exit 1
          fi
          echo "Published image is healthy."

      - name: Report deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ steps.smoke_test.outcome }}" = "success" ]; then
            state=success
            description="Published image booted and /actuator/health reported UP"
          else
            state=failure
            description="Published image failed to boot or become healthy - see job logs"
          fi
          gh api "repos/${{ github.repository }}/deployments/${{ steps.create-deployment.outputs.id }}/statuses" \
            -f state="$state" \
            -f description="$description" \
            >/dev/null

      - name: Clean up smoke test container
        if: always()
        run: docker rm -f smoke-test || true

      - name: Notify Slack if the deployment smoke test failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_ALERTS_WEBHOOK_URL secret not set - skipping Slack notification." >&2
            exit 0
          fi
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          text=":red_circle: *Published image failed its post-deploy health check*
          <$run_url|View run> - image \`${{ env.IMAGE_NAME }}:${{ needs.publish.outputs.sha_tag }}\` never reported healthy"
          payload=$(jq -n --arg text "$text" '{text: $text}')
          curl -sf -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
