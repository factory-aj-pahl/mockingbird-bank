name: Release

# Cutting a release is one command: `git tag v1.2.3 && git push origin v1.2.3`.
# That tag push publishes the release-drafter draft (see
# release-drafter.yml) as a real GitHub Release under this tag, and builds +
# pushes a Docker image to GHCR tagged with the same version - so "there's a
# release" and "there's a deployable image for that release" happen
# together, not as two separately-remembered manual steps.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish release from draft
        uses: release-drafter/release-drafter@v6
        with:
          publish: true
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-image:
    name: Build and push versioned image
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The jar's version is the tag's version (APP_VERSION overrides the
      # computed <baseVersion>-<sha>); the commit still comes from git.
      - name: Collect build metadata
        id: buildmeta
        env:
          APP_VERSION: ${{ needs.publish-release.outputs.version }}
        run: ./scripts/build-metadata.sh >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.publish-release.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            APP_VERSION=${{ steps.buildmeta.outputs.APP_VERSION }}
            GIT_COMMIT=${{ steps.buildmeta.outputs.GIT_COMMIT }}
            GIT_BRANCH=${{ steps.buildmeta.outputs.GIT_BRANCH }}
            GIT_DIRTY=${{ steps.buildmeta.outputs.GIT_DIRTY }}
            GIT_COMMIT_TIME=${{ steps.buildmeta.outputs.GIT_COMMIT_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
