spring:
  application:
    name: mockingbird-bank
  datasource:
    # Local dev fallback only. Override via SPRING_DATASOURCE_URL/USERNAME/PASSWORD
    # env vars for anything beyond a laptop - see .env.example for the Docker path
    # and k8s/01-postgres-secret.yaml.example for the cluster path.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydatabase}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
  jpa:
    hibernate:
      # Flyway (below) owns the schema now; Hibernate just checks its
      # entity mappings still match what Flyway created.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    # Anyone who already ran this app pre-Flyway has these exact tables
    # from ddl-auto=update, but no flyway_schema_history. Without this,
    # V1 (which recreates that same schema) fails with "relation already
    # exists" on every pre-existing database. baseline-version defaults
    # to 1, matching V1, so this only marks V1 as already-applied on a
    # non-empty schema - a genuinely empty database (e.g. a fresh
    # Testcontainers or k8s Postgres) still runs V1 normally.
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    # Spring Boot's documented hook for adding MDC values next to the log level -
    # CorrelationIdFilter puts correlationId in MDC per request; traceId/spanId are populated
    # automatically by Micrometer Tracing (see management.tracing below) for the duration of
    # a traced operation, so a log line and the distributed trace it happened inside of can be
    # cross-referenced in either direction.
    level: '%5p [%X{correlationId:-},%X{traceId:-},%X{spanId:-}]'

vaadin:
  launch-browser: true

management:
  endpoints:
    web:
      exposure:
        # health stays public (see SecurityConfig); featureflags/profiling
        # are ops-facing, reachable once authenticated.
        include: health,featureflags,profiling
  tracing:
    sampling:
      # This app is small enough that 100% sampling isn't a cost/volume concern - trace every
      # request rather than risk missing the one that mattered. A busier deployment would dial
      # this down (e.g. 0.1) via MANAGEMENT_TRACING_SAMPLING_PROBABILITY.
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          # Spring Boot's own default if unset - a collector at this address is optional, not
          # required: with nothing listening there, the OTLP exporter just fails to send spans
          # in the background (no impact on requests, nothing thrown into application code).
          # Point it at a real collector (Jaeger, Tempo, Datadog agent, ...) via this env var to
          # actually collect traces - see AGENTS.md's "Distributed tracing" section for how to
          # verify that locally against a throwaway Jaeger container.
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        # spring-boot-starter-opentelemetry pulls in an OTLP *metrics* registry alongside
        # tracing (a separate Micrometer feature under its own, unrenamed management.otlp.*
        # namespace), which otherwise logs a WARN every minute trying to push metrics to a
        # collector that in this app's case doesn't speak the metrics half of OTLP (Jaeger
        # doesn't). This app already has its own metrics story (Micrometer's product.events
        # counter, JVM/HTTP metrics via /actuator/metrics) - only distributed tracing is wanted
        # from this dependency, so its bundled metrics exporter is switched off explicitly.
        enabled: false

# Defaults match today's actual behavior - see FeatureFlagsProperties and
# AGENTS.md's "Feature flags" section. Override per-environment via
# MOCKINGBIRD_FEATURE_FLAGS_<NAME> env vars, no code change/redeploy needed.
mockingbird:
  feature-flags:
    show-account-number-on-dashboard: true
    show-welcome-banner: false
    allow-account-number-reveal: true
